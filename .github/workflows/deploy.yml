name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro project
        run: pnpm check

      - name: Build website
        run: pnpm build

      - name: Publish static files to build branch
        run: |
          if git ls-remote --exit-code --heads origin build >/dev/null 2>&1; then
            git fetch origin build
            git worktree add -B build ../deploy origin/build
          else
            git worktree add --detach ../deploy HEAD
            git -C ../deploy switch --orphan build
          fi

          find ../deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. ../deploy/
          touch ../deploy/.nojekyll

          git -C ../deploy add --all
          git -C ../deploy config user.name "github-actions[bot]"
          git -C ../deploy config user.email "github-actions[bot]@users.noreply.github.com"

          if git -C ../deploy diff --cached --quiet; then
            echo "No build changes to publish"
          else
            git -C ../deploy commit -m "chore: deploy website"
            git -C ../deploy push origin HEAD:build
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
